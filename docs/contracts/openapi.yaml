              description: Sekunde do ponovnog pokušaja
        '503':
          description: Podaci ili komponenta nisu spremni
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/spaces:
    get:
      operationId: listSpaces
      summary: Filtrirani popis prostora
      tags:
      - Public
      x-phase: MVP
      responses:
        '200':
          description: Uspješan odgovor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceList'
        '404':
          description: Resurs ne postoji ili dodatak nije uključen
          content:
