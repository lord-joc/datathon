        '409':
          description: Sukob verzije ili osnove usporedbe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ulaz ili poslovno pravilo nije valjano
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Previše zahtjeva
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Sekunde do ponovnog pokušaja
        '503':
          description: Podaci ili komponenta nisu spremni
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: dataset_bundle_id
        in: query
        required: false
        description: Optional guard; a bundle other than the active one gives 409 DATASET_CHANGED.
        schema:
          type: string
          format: uuid
      - name: profile
        in: query
        required: true
        schema:
          type: string
          enum:
          - cafe
          - office
          - retail
          - food_takeaway
          - personal_care
          - education
          - workshop
      - name: area_min_m2
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 100000
      - name: area_max_m2
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 100000
      - name: district_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 17
      - name: include_conditional
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: include_excluded
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - &id001
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id002
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
