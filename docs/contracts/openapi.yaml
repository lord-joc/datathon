        description: Optional guard; a bundle other than the active one gives 409 DATASET_CHANGED.
        schema:
          type: string
          format: uuid
      - name: profile
        in: query
        required: true
        schema:
          type: string
          enum:
          - cafe
          - office
          - retail
          - food_takeaway
          - personal_care
