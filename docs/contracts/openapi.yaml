        '403':
          description: Pristup nije dopušten
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resurs ne postoji ili dodatak nije uključen
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Resurs je istekao
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Previše zahtjeva
          content:
            application/problem+json:
