# ProstorIQ local and demo stack.
#   docker compose up -d --build                  -> http://localhost:8080
#   docker compose run --rm cli python -m app.cli migrate
#   docker compose run --rm cli python -m app.cli import-all
name: prostoriq

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  db:
    <<: *hardening
    # Digest verified in documentation v3 (amd64). On Apple Silicon this runs under emulation.
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prostoriq}
      POSTGRES_USER: ${POSTGRES_USER:-prostoriq_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postavi POSTGRES_PASSWORD u .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Postavi API_DB_PASSWORD u .env}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?Postavi PIPELINE_DB_PASSWORD u .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Mounted as a single file so the image's own PostGIS init script stays in place.
      - ./db/init/10-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    # Bound to localhost only, for local tools (DBeaver, psql). Never public.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *hardening
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-prostoriq}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: prostoriq_api
      DATABASE_PASSWORD: ${API_DB_PASSWORD}
      APP_HMAC_SECRET: ${APP_HMAC_SECRET:?Postavi APP_HMAC_SECRET u .env}
    depends_on:
      db:
        condition: service_healthy
    # Exposed on localhost for the Vite dev server proxy (npm run dev).
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]

  # One-off tasks (migrations, imports). Same image as the API, but it is the only service
  # that holds the owner and pipeline credentials; the public API never sees them.
  cli:
    build:
      context: ./backend
    profiles: [tools]
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      POSTGRES_DB: ${POSTGRES_DB:-prostoriq}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: prostoriq_api
      DATABASE_PASSWORD: ${API_DB_PASSWORD}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prostoriq_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prostoriq}
      PIPELINE_DATABASE_URL: postgresql+psycopg://prostoriq_pipeline:${PIPELINE_DB_PASSWORD}@db:5432/${POSTGRES_DB:-prostoriq}
      CONFIG_DIR: /app/config
      RAW_STORAGE_DIR: /var/lib/prostoriq/raw
    volumes:
      - ./config:/app/config:ro
      - raw_data:/var/lib/prostoriq/raw
      # Manually downloaded files for "import CODE --file /app/manual/<name>".
      - ./data/manual:/app/manual:ro
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]

  web:
    <<: *hardening
    build:
      context: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  raw_data:
  caddy_data:
  caddy_config:
