        '422':
          description: Ulaz ili poslovno pravilo nije valjano
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Previše zahtjeva
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Sekunde do ponovnog pokušaja
        '503':
          description: Podaci ili komponenta nisu spremni
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: dataset_bundle_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
  /api/v1/status:
    get:
      operationId: getSystemStatus
      summary: Spremnost i stanje lokalnog paketa
      tags:
