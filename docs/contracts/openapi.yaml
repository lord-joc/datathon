components:
  securitySchemes:
    AdminCookie:
      type: apiKey
      in: cookie
      name: prostor_iq_session
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      description: RFC 9457 problem details; code is the stable machine code. Extension
        members carry details (e.g. missing_by_space, comparison_basis_token for 409).
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
          format: uuid
      required:
      - type
      - title
      - status
      - code
      - detail
    Metric:
      type: object
      additionalProperties: false
      properties:
        value:
          type:
          - number
          - 'null'
        unit:
          type: string
          enum:
          - m
          - count
          - m2
          - objects_per_km2
          - eur_month
          - utility
        reason:
          type:
          - string
          - 'null'
          enum:
          - missing_coordinate
          - data_not_available
          - source_unavailable
          - coverage_unchecked
          - partial_coverage
          - cost_not_configured
          - unknown_position
          - no_common_criteria
          - not_applicable
          - null
        source_version_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
        detail:
          type: object
          description: Display context, never scored (nearest name, mode, distance 'air',
            nearest_names, counts by category).
          additionalProperties: true
      required:
      - value
      - unit
      - reason
      - source_version_ids
      allOf:
      - if:
          properties:
            value:
              type: 'null'
          required:
          - value
        then:
          properties:
            reason:
              type: string
        else:
          properties:
            reason:
              type: 'null'
    Point:
      type: object
      additionalProperties: false
      properties:
        type:
          const: Point
        coordinates:
          type: array
          prefixItems:
          - type: number
            minimum: -180
            maximum: 180
          - type: number
            minimum: -90
            maximum: 90
          minItems: 2
          maxItems: 2
      required:
      - type
