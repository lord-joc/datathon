openapi: 3.1.0
info:
  title: ProstorIQ vlastiti aplikacijski API
  version: 3.1.0
  description: Implementacijski ugovor. Rute nisu objavljena usluga. Primjeri u prilogu
    su umjetni ugovorni podaci; izvorni zapisi nalaze se zasebno u registru.
servers:
- url: http://localhost:8000
  description: Predloženi lokalni razvojni API nakon implementacije
tags:
- name: Public
- name: Admin
paths:
  /api/v1/profiles:
    get:
      operationId: listProfiles
      summary: Podržani zadani profili
      tags:
      - Public
      x-phase: MVP
      responses:
        '200':
          description: Uspješan odgovor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        '404':
          description: Resurs ne postoji ili dodatak nije uključen
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Sukob verzije ili osnove usporedbe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ulaz ili poslovno pravilo nije valjano
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Previše zahtjeva
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Sekunde do ponovnog pokušaja
        '503':
          description: Podaci ili komponenta nisu spremni
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/districts:
    get:
      operationId: listDistricts
      summary: Četvrti aktivnog ili odabranog paketa
      tags:
      - Public
      x-phase: MVP
      responses:
        '200':
          description: Uspješan odgovor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictList'
        '404':
          description: Resurs ne postoji ili dodatak nije uključen
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Sukob verzije ili osnove usporedbe
          content:
            application/problem+json:
              schema:
