              schema:
                type: integer
                minimum: 1
              description: Sekunde do ponovnog pokušaja
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ranking-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 100
        description: Token vraćen samo pri stvaranju izračuna; ne zapisivati u logove.
  /api/v1/spaces/{id}/competitors:
